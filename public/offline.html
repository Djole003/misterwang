<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nema interneta</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            max-width: 320px;
            padding: 30px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            opacity: 0.85;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background: #27ae60;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>📡 Nema interneta</h1>
    <p>Proverite internet konekciju i pokušajte ponovo.</p>

    <button onclick="location.reload()">Pokušaj ponovo</button>
</div>

</body>
</html>
